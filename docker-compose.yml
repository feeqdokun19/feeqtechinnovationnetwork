services:

  postgres:
    image: postgres:17-alpine
    container_name: serviceconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - serviceconnect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - serviceconnect

  backend:
    build:
      context: ./backend
    container_name: serviceconnect-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - serviceconnect

  frontend:
    build:
      context: ./frontend
    container_name: serviceconnect-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - serviceconnect

  nginx:
    image: nginx:1.27-alpine
    container_name: serviceconnect-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - serviceconnect

volumes:
  serviceconnect_postgres_data:

networks:
  serviceconnect:
    driver: bridge
